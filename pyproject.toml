[project]
name = "co-student-rf-detr"
version = "0.1.0"
description = "RF-DETR training experiments"
requires-python = ">=3.10,<3.14"
dependencies = [
    "rfdetr[train]>=1.8.2",
    "transformers>=5.1.0,<6.0",
    "torch",
    "torchvision",
    "wandb>=0.18.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }


[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true